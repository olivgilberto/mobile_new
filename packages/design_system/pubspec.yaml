name: design_system
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.4

# Material 3 tokens, theme and reusable components. Inter (SIL OFL, see
# assets/fonts/Inter-LICENSE.txt) is bundled locally — never google_fonts.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
